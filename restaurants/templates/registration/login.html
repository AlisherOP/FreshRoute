<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in to FreshRoute</title>
</head>
<body>
  <main>
    <h1>Log in to FreshRoute</h1>
    {% if form.errors %}<p>Username or password was not accepted. Try again.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
