<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FreshRoute</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f8;
            color: #1e293b;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 32px 28px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #16a34a;
            margin-bottom: 6px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
        }

        .subtitle {
            margin: 0 0 24px;
            font-size: 14px;
            color: #64748b;
        }

        form p {
            margin: 0 0 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            color: #0f172a;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
        }

        .helptext,
        span.helptext {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.4;
        }

        .errorlist {
            list-style: none;
            margin: 6px 0 0;
            padding: 8px 12px;
            font-size: 13px;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 8px;
            padding: 11px 16px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background: #16a34a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        button[type="submit"]:hover {
            background: #15803d;
        }

        .auth-footer {
            margin: 20px 0 0;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        .auth-footer a {
            color: #16a34a;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="auth-card">
        <div class="brand">FreshRoute</div>
        <h1>Create an account</h1>
        <p class="subtitle">Choose your role to get started.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </p>
    </main>
</body>

</html>
